# 部署：在 .env 中填写 ADMIN_PASSWORD 和 AUTHORIZATION_TOKEN，然后运行 docker compose up -d --build
# 自带 Redis，并通过 serverless-redis-http 提供 Upstash 兼容的 REST 接口，不需要 Upstash 账号。
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8791}:8791"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      AUTHORIZATION_TOKEN: ${AUTHORIZATION_TOKEN:?请在 .env 中设置 AUTHORIZATION_TOKEN}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-jev:}
      KV_REST_API_URL: http://redis-http
      KV_REST_API_TOKEN: ${REDIS_HTTP_TOKEN:-jev-proxy-pool}
      PORT: 8791
    depends_on:
      - redis-http

  # 只在 compose 内部网络中可访问，不对外暴露端口。
  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${REDIS_HTTP_TOKEN:-jev-proxy-pool}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  redis-data:
